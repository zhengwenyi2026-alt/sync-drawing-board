<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>同步画板 - Sync Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 首页 -->
    <div id="lobby" class="screen active">
        <div class="lobby-container">
            <h1 class="logo">🎨 同步画板</h1>
            <p class="subtitle">实时同步绘画，跨设备共享画布</p>
            <div class="lobby-buttons">
                <button id="btn-create" class="btn btn-primary">创建房间</button>
                <button id="btn-join" class="btn btn-secondary">加入房间</button>
            </div>
            <div class="server-config">
                <details>
                    <summary>️ 高级设置（自定义服务器加速）</summary>
                    <div class="server-input-group">
                        <label>PeerJS 服务器地址（可选）</label>
                        <input type="text" id="server-url" class="server-input" placeholder="留空使用默认服务器">
                        <p class="hint">填入自建 PeerJS 服务器地址可大幅加速连接<br>例如: https://your-peerjs-server.com</p>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- 创建房间 -->
    <div id="create-screen" class="screen">
        <div class="lobby-container">
            <h2>创建房间</h2>
            <input type="text" id="create-room-code" class="room-input" placeholder="输入房间号（任意字符）" maxlength="20" autocomplete="off">
            <p class="hint">设定一个房间号，告诉对方输入相同的房间号加入</p>
            <div class="role-select">
                <p>选择你的角色：</p>
                <div class="role-buttons">
                    <button class="btn btn-send active" data-role="send">📤 发送（我来画）</button>
                    <button class="btn btn-receive" data-role="receive"> 接收（看对方画）</button>
                </div>
            </div>
            <button id="btn-start-create" class="btn btn-primary">进入画板</button>
            <button class="btn btn-back" onclick="goBack()">返回</button>
        </div>
    </div>

    <!-- 加入房间 -->
    <div id="join-screen" class="screen">
        <div class="lobby-container">
            <h2>加入房间</h2>
            <input type="text" id="join-room-code" class="room-input" placeholder="输入房间号" maxlength="20" autocomplete="off">
            <div class="role-select">
                <p>选择你的角色：</p>
                <div class="role-buttons">
                    <button class="btn btn-send active" data-role="send">📤 发送（我来画）</button>
                    <button class="btn btn-receive" data-role="receive">📥 接收（看对方画）</button>
                </div>
            </div>
            <button id="btn-start-join" class="btn btn-primary">加入并进入画板</button>
            <button class="btn btn-back" onclick="goBack()">返回</button>
        </div>
    </div>

    <!-- 画板页面 -->
    <div id="canvas-screen" class="screen">
        <!-- 顶部信息栏 -->
        <div class="canvas-header">
            <div class="room-info">
                <span>房间: <strong id="current-room-code">------</strong></span>
                <span class="role-badge" id="role-badge">发送</span>
                <span class="status-badge" id="connection-status">连接中...</span>
            </div>
            <div class="header-actions">
                <button id="btn-undo" class="btn-tool" title="撤销">↩️</button>
                <button id="btn-redo" class="btn-tool" title="重做">️</button>
                <button id="btn-clear" class="btn-tool" title="清空画布">🗑️</button>
                <button id="btn-download" class="btn-tool" title="下载画作">💾</button>
                <button id="btn-leave" class="btn-tool btn-danger" title="离开">🚪</button>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
        </div>

        <!-- 底部工具栏 -->
        <div class="toolbar">
            <!-- 笔刷工具 -->
            <div class="tool-section">
                <button class="tool-btn active" data-tool="brush" title="画笔">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a1 1 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 000-1.41z" fill="currentColor"/></svg>
                </button>
                <button class="tool-btn" data-tool="pencil" title="铅笔">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
                </button>
                <button class="tool-btn" data-tool="marker" title="马克笔">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M18.3 3.3a1.5 1.5 0 00-2.1 0L4 15.5V20h4.5L20.7 5.4a1.5 1.5 0 000-2.1l-2.4-2.4zM6.7 18.3H5.7v-1l9.3-9.3 1 1-9.3 9.3z" fill="currentColor"/></svg>
                </button>
                <button class="tool-btn" data-tool="fine" title="细线笔">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" opacity="0.5"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="橡皮擦">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M16.24 3.56l4.95 4.94a1.5 1.5 0 010 2.12L12 19.81a1.5 1.5 0 01-1.06.44H5a1.5 1.5 0 01-1.5-1.5V12.5a1.5 1.5 0 01.44-1.06l9.18-9.18a1.5 1.5 0 012.12 0zM4.93 20.25h14.14v1.5H3.5v-1.5h1.43z" fill="currentColor"/></svg>
                </button>
            </div>

            <!-- 分隔线 -->
            <div class="tool-divider"></div>

            <!-- 图形工具 -->
            <div class="tool-section">
                <button class="tool-btn" data-tool="line" title="直线">
                    <svg viewBox="0 0 24 24" width="28" height="28"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <button class="tool-btn" data-tool="rect" title="矩形">
                    <svg viewBox="0 0 24 24" width="28" height="28"><rect x="4" y="6" width="16" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" title="圆形">
                    <svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="triangle" title="三角形">
                    <svg viewBox="0 0 24 24" width="28" height="28"><polygon points="12,4 20,20 4,20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                <button class="tool-btn" data-tool="arrow" title="箭头">
                    <svg viewBox="0 0 24 24" width="28" height="28"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="10,5 19,5 19,14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <!-- 分隔线 -->
            <div class="tool-divider"></div>

            <!-- 颜色和大小 -->
            <div class="tool-section color-section">
                <div class="color-presets">
                    <button class="color-dot active" data-color="#000000" style="background:#000"></button>
                    <button class="color-dot" data-color="#e74c3c" style="background:#e74c3c"></button>
                    <button class="color-dot" data-color="#3498db" style="background:#3498db"></button>
                    <button class="color-dot" data-color="#2ecc71" style="background:#2ecc71"></button>
                    <button class="color-dot" data-color="#f39c12" style="background:#f39c12"></button>
                    <button class="color-dot" data-color="#9b59b6" style="background:#9b59b6"></button>
                    <button class="color-dot" data-color="#ffffff" style="background:#fff; border: 1px solid #ccc"></button>
                </div>
                <div class="size-control">
                    <input type="range" id="brush-size" min="1" max="50" value="3">
                    <span id="brush-size-label">3px</span>
                </div>
                <input type="color" id="color-picker" value="#000000" title="自定义颜色">
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
