<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步画板 - Sync Drawing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 首页：发起/加入房间 -->
    <div id="lobby" class="screen active">
        <div class="lobby-container">
            <h1 class="logo">🎨 同步画板</h1>
            <p class="subtitle">实时同步你的绘画，跨设备共享画布</p>
            <div class="lobby-buttons">
                <button id="btn-create" class="btn btn-primary">发起房间</button>
                <button id="btn-join" class="btn btn-secondary">加入房间</button>
            </div>
        </div>
    </div>

    <!-- 发起房间：显示房间号 -->
    <div id="create-screen" class="screen">
        <div class="lobby-container">
            <h2>你的房间号</h2>
            <p class="room-code" id="room-code-display">------</p>
            <p class="hint">在其他设备上打开此网站，输入此房间号加入</p>
            <div class="role-select">
                <p>选择你的角色：</p>
                <div class="role-buttons">
                    <button class="btn btn-send active" data-role="send">📤 发送（画板主机）</button>
                    <button class="btn btn-receive" data-role="receive">📥 接收（观看画板）</button>
                </div>
            </div>
            <button id="btn-start-create" class="btn btn-primary">进入画板</button>
            <button class="btn btn-back" onclick="goBack()">返回</button>
        </div>
    </div>

    <!-- 加入房间：输入房间号 -->
    <div id="join-screen" class="screen">
        <div class="lobby-container">
            <h2>加入房间</h2>
            <input type="text" id="room-code-input" class="room-input" placeholder="输入房间号" maxlength="6">
            <div class="role-select">
                <p>选择你的角色：</p>
                <div class="role-buttons">
                    <button class="btn btn-send active" data-role="send">📤 发送（画板主机）</button>
                    <button class="btn btn-receive" data-role="receive">📥 接收（观看画板）</button>
                </div>
            </div>
            <button id="btn-start-join" class="btn btn-primary">加入并进入画板</button>
            <button class="btn btn-back" onclick="goBack()">返回</button>
        </div>
    </div>

    <!-- 画板页面 -->
    <div id="canvas-screen" class="screen">
        <div class="canvas-header">
            <div class="room-info">
                <span>房间: <strong id="current-room-code">------</strong></span>
                <span class="role-badge" id="role-badge">发送</span>
                <span class="status-badge" id="connection-status">连接中...</span>
            </div>
            <div class="canvas-tools">
                <input type="color" id="color-picker" value="#000000" title="画笔颜色">
                <input type="range" id="brush-size" min="1" max="50" value="3" title="画笔大小">
                <span id="brush-size-label">3px</span>
                <button id="btn-eraser" class="btn-tool" title="橡皮擦">🧹</button>
                <button id="btn-clear" class="btn-tool" title="清空画布">🗑️</button>
                <button id="btn-download" class="btn-tool" title="下载画作">💾 下载</button>
                <button id="btn-leave" class="btn-tool btn-danger" title="离开房间">🚪 离开</button>
            </div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
